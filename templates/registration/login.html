{% extends "base.html" %}

{% block title %}用户登录{% endblock %}

{% block content %}
    <h1>用户登录</h1>

    <p>使用已有账号登录；新用户可先提交注册申请。</p>

    {% if form.errors %}
        <p style="color: #b91c1c;">
            用户名或密码错误，请重新输入。
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="{{ form.username.id_for_label }}">
            用户名
        </label>
        {{ form.username }}

        <label for="{{ form.password.id_for_label }}">
            密码
        </label>
        {{ form.password }}

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button type="submit">登录</button>
    </form>

    <p><a href="{% url 'accounts:register' %}">没有账号？申请注册</a></p>
{% endblock %}
